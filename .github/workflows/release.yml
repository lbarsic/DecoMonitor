name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp the build version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = (Get-Content version.txt -Raw).Trim()
          }
          if ($version -notmatch "^v\d+\.\d+\.\d+$") {
            throw "version.txt must look like v1.0.1"
          }
          Set-Content -Path version.txt -Value $version -NoNewline -Encoding ascii
          Add-Content -Path $env:GITHUB_ENV -Value "DECOMONITOR_VERSION=$version" -Encoding utf8
      - name: Build DecoMonitor.exe
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm DecoMonitor.spec
      - name: Publish the exe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:DECOMONITOR_VERSION
          $named = "dist/DecoMonitor-$tag.exe"
          Copy-Item dist/DecoMonitor.exe $named
          gh release view $tag --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $named dist/DecoMonitor.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $tag --notes "Download DecoMonitor-$tag.exe. The dashboard asks before downloading or installing. Installing restarts the server."
          } else {
            gh release upload $tag $named dist/DecoMonitor.exe --repo $env:GITHUB_REPOSITORY --clobber
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $old = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json
          foreach ($item in $old) {
            if ($item.tagName -like "b-*") {
              gh release delete $item.tagName --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
            }
          }
