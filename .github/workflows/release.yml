name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build DecoMonitor.exe
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm DecoMonitor.spec
      - name: Publish the exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/DecoMonitor.exe --title "${{ github.ref_name }}" --notes "Open DecoMonitor.exe and approve the administrator prompt. It records bandwidth from boot and opens http://127.0.0.1:8787/."
